<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi Kiosk Tiles</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #111; overflow: hidden;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }

  .container {
    width: 1920px; height: 1200px; margin: 0 auto;
    display: flex; flex-direction: column;
  }

  .top {
    display: grid;
    grid-template-columns: 960px 960px;
    grid-template-rows: 600px;
  }

  .bottom {
    display: grid;
    grid-template-columns: 640px 640px 640px;
    grid-template-rows: 600px;
  }

  .tile {
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 2rem; font-weight: 600; overflow: hidden;
  }

  .tile2 { position: relative; background: #000; overflow: hidden; }
  .tile2::before {
    z-index: 0;
    content: "";
    position: absolute;
    inset: 0;
    background: url('img/house.jpg') center / cover no-repeat;
    opacity: 0.2;
    pointer-events: none;
  }

  /* Tile 2 text overlay (bottom-left) */
  .tile2-overlay {
    z-index: 1;
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    justify-content: flex-end;   /* bottom */
    align-items: flex-start;     /* left */
    padding: 28px 32px;
    pointer-events: none;
  }

  .nest-title{
    font-size:2rem; font-weight:400; opacity:.8;
    text-shadow:0 2px 8px rgba(0,0,0,.5);
    margin-left:-6px; /* nudge so "45" aligns with grid text */
  }

  .nest-lines{
    margin-top:8px; font-size:2rem; line-height:1.25; font-weight:400; opacity:.8;
    text-shadow:0 2px 8px rgba(0,0,0,.5);
  }

  /* Grid near center, left-aligned text */
  .nest-grid {
    display: grid;
    grid-template-columns: auto auto auto; /* Room | Temp | Humidity */
    gap: 8px 18px;
    align-items: baseline;
    position: relative;
    left: 48%;
    transform: translateX(-50%);
    text-align: left;
  }
  .nest-grid .cell.temp,
  .nest-grid .cell.hum {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }

  .tile3 { position: relative; background: #000; overflow: hidden; }
  .tile3 iframe {
    position: absolute;
    top: 50%; left: 50%;
    width: 1024px; height: 829px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(0.625);
    border: 0;
  }

  .tile4 { background: #9b59b6; }
  .tile5 { background: #c0392b; }

  .tile1 iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
  <div class="container">
    <div class="top">
      <div class="tile tile1">
        <iframe
          src="https://www.youtube.com/embed/ww6oRiTtszE?autoplay=1&mute=1"
          title="YouTube video player"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>

      <div class="tile tile2">
        <div class="tile2-overlay" id="nestOverlay">
          <div class="nest-title">45 McKay Road</div>
          <div class="nest-lines">
            <div id="nestGrid" class="nest-grid" aria-label="Nest readings">
              <!-- Thermostat rows injected here -->
              <!-- Outbuilding row is always present at the end of the same grid -->
              <div class="cell room">Outbuilding</div>
              <div class="cell temp"><span id="outbuildingTemp">—</span></div>
              <div class="cell hum"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom">
      <div class="tile tile3">
        <iframe
          src="https://newengland511.org/map/Cctv/1672?t=1760281998"
          allowfullscreen>
        </iframe>
      </div>
      <div class="tile tile4">Tile 4</div>
      <div class="tile tile5">Tile 5</div>
    </div>
  </div>

<script>
  // Dev auto-reload
  const DEV_AUTO_RELOAD = true;
  if (DEV_AUTO_RELOAD) {
    let last = '';
    async function poll() {
      try {
        const res = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' });
        const lm = res.headers.get('last-modified') || '';
        if (last && lm && lm !== last) { location.reload(); return; }
        last = lm;
      } catch {}
      setTimeout(poll, 1500);
    }
    poll();
  }
</script>

<script>
  // Refresh only Tile 3 every 3 minutes
  setInterval(() => {
    const cam = document.querySelector('.tile3 iframe');
    if (cam) {
      const src = cam.src.split('?')[0];
      cam.src = `${src}?t=${Date.now()}`;
    }
  }, 180000);
</script>

<script>
  const REL = 'data/nest.json';
  const ABS = 'file:///home/fcapria/app/data/nest.json';
  const REFRESH_MS = 300000;

  async function fetchJSON(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }

  function renderNestGrid(containerEl, thermostats) {
    // Keep the Outbuilding 3 cells that are already in the grid
    const outCells = Array.from(containerEl.querySelectorAll('#outbuildingTemp'))
      .map(span => {
        const tempCell = span.closest('.cell');
        return {
          room: tempCell?.previousElementSibling?.outerHTML || '',
          temp: tempCell?.outerHTML || '',
          hum:  tempCell?.nextElementSibling?.outerHTML || ''
        };
      })[0];

    const thermoHTML = (thermostats || [])
      .filter(t => t && t.room && t.tempF != null)
      .sort((a,b) => String(a.room).localeCompare(String(b.room)))
      .map(t => `
        <div class="cell room">${t.room}</div>
        <div class="cell temp">${Number(t.tempF).toFixed(1)}°F</div>
        <div class="cell hum">${t.humidity != null ? `${t.humidity}%` : '—'}</div>
      `).join('');

    const fallback = `
      <div class="cell room">No thermostats</div>
      <div class="cell temp">—</div>
      <div class="cell hum">—</div>
    `;

    // Rebuild grid content: thermostat rows + preserved Outbuilding cells
    containerEl.innerHTML =
      (thermoHTML || fallback) +
      ((outCells && (outCells.room + outCells.temp + outCells.hum)) ||
       `<div class="cell room">Outbuilding</div>
        <div class="cell temp"><span id="outbuildingTemp">—</span></div>
        <div class="cell hum"></div>`);
  }

  async function load_nest() {
    const grid = document.getElementById('nestGrid');
    if (!grid) return;
    try {
      const data = await fetchJSON(REL).catch(() => fetchJSON(ABS));
      renderNestGrid(grid, data.thermostats);
    } catch {
      setTimeout(async () => {
        try {
          const data = await fetchJSON(ABS);
          renderNestGrid(grid, data.thermostats);
        } catch {
          // Keep Outbuilding row even on failure
          const existingOut = `
            <div class="cell room">Outbuilding</div>
            <div class="cell temp"><span id="outbuildingTemp">—</span></div>
            <div class="cell hum"></div>`;
          grid.innerHTML = `
            <div class="cell room">Unavailable</div>
            <div class="cell temp">—</div>
            <div class="cell hum">—</div>
          ` + existingOut;
        }
      }, 1500);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    load_nest();
    setInterval(load_nest, REFRESH_MS);
  });
</script>

<script>
  // Outbuilding updater (does not add °F automatically)
  (async () => {
    const REL = "data/outbuilding.txt";
    const ABS = "file:///home/fcapria/app/data/outbuilding.txt";
    const REFRESH_MS = 1800000; // 30 minutes

    async function loadOutbuilding() {
      try {
        const res = await fetch(REL).catch(() => fetch(ABS));
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = (await res.text()).trim();
        const span = document.getElementById("outbuildingTemp");
        if (span) span.textContent = text || "—";
      } catch {
        const span = document.getElementById("outbuildingTemp");
        if (span) span.textContent = "Unavailable";
      }
    }
    loadOutbuilding();
    setInterval(loadOutbuilding, REFRESH_MS);
  })();
</script>
</body>
</html>
