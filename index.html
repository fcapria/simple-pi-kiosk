<!doctype html> 
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi Kiosk Tiles</title>
  <link rel="stylesheet" href="kiosk.css?v=5">
</head>

<body>
  <div class="container">
    <div class="top">
      <!-- === Tile 1 === -->
      <div class="tile tile1">
        <iframe
          src="https://www.youtube-nocookie.com/embed/pxJSwpFdD1Q?autoplay=1&mute=1"
          title="YouTube video player"
          allow="autoplay; encrypted-media; picture-in-picture"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      </div>

      <!-- === Tile 2 === -->
      <div class="tile tile2">
        <!-- Solar Event (upper-right) -->
        <div class="solar-event-topright">
          <div id="solar-time" class="solar-event-time"></div>
          <div id="solar-count" class="solar-event-count"></div>
        </div>

        <!-- Nest overlay (bottom-left) -->
        <div class="tile2-overlay" id="nestOverlay">
          <div class="nest-title">45 McKay Road</div>
          <div class="nest-lines">
            <div id="nestGrid" class="nest-grid" aria-label="Nest readings">
              <!-- Thermostat rows injected here -->
              <!-- Outbuilding row is always present at the end of the same grid -->
              <div class="cell room">Outbuilding</div>
              <div class="cell temp"><span id="outbuildingTemp">—</span></div>
              <div class="cell hum"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- === Bottom Row === -->
    <div class="bottom">
      <div class="tile tile3">
        <iframe
          src="https://newengland511.org/map/Cctv/1672?t=1760281998"
          allowfullscreen>
        </iframe>
      </div>

      <!-- === Tile 4 (Tide Gauge) === -->
      <div class="tile tile4">
        <div class="tide-gauge">
          <div id="tide-high-label" class="tide-label">High —</div>

          <div class="tide-bar-wrap">
            <div class="tide-bar">
              <div id="tide-marker" class="tide-marker"></div>
            </div>
            <div id="tide-arrow" class="tide-arrow">↓</div>
          </div>

          <div id="tide-low-label" class="tide-label">Low —</div>
        </div>

        <div id="tide-current-label" class="tide-current-label">
          Current —
        </div>
      </div>

      <!-- === Tile 5 === -->
      <div class="tile tile5">Tile 5</div>
    </div>
  </div>

  <!-- === Dev Auto-Reload === -->
  <script>
    const DEV_AUTO_RELOAD = true;
    if (DEV_AUTO_RELOAD) {
      let last = '';
      async function poll() {
        try {
          const res = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' });
          const lm = res.headers.get('last-modified') || '';
          if (last && lm && lm !== last) { location.reload(); return; }
          last = lm;
        } catch {}
        setTimeout(poll, 1500);
      }
      poll();
    }
  </script>

  <!-- === Refresh Tile 3 every 3 minutes === -->
  <script>
    setInterval(() => {
      const cam = document.querySelector('.tile3 iframe');
      if (cam) {
        const src = cam.src.split('?')[0];
        cam.src = `${src}?t=${Date.now()}`;
      }
    }, 180000);
  </script>

  <!-- === Nest Data Loader === -->
  <script>
    const REL = 'data/nest.json';
    const ABS = 'file:///home/fcapria/app/data/nest.json';
    const REFRESH_MS = 300000;

    async function fetchJSON(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }

    function renderNestGrid(containerEl, thermostats) {
      const outCells = Array.from(containerEl.querySelectorAll('#outbuildingTemp'))
        .map(span => {
          const tempCell = span.closest('.cell');
          return {
            room: tempCell?.previousElementSibling?.outerHTML || '',
            temp: tempCell?.outerHTML || '',
            hum:  tempCell?.nextElementSibling?.outerHTML || ''
          };
        })[0];

      const thermoHTML = (thermostats || [])
        .filter(t => t && t.room && t.tempF != null)
        .sort((a,b) => String(a.room).localeCompare(String(b.room)))
        .map(t => `
          <div class="cell room">${t.room}</div>
          <div class="cell temp">${Number(t.tempF).toFixed(1)}°F</div>
          <div class="cell hum">${t.humidity != null ? `${t.humidity}%` : '—'}</div>
        `).join('');

      const fallback = `
        <div class="cell room">No thermostats</div>
        <div class="cell temp">—</div>
        <div class="cell hum">—</div>
      `;

      containerEl.innerHTML =
        (thermoHTML || fallback) +
        ((outCells && (outCells.room + outCells.temp + outCells.hum)) ||
         `<div class="cell room">Outbuilding</div>
          <div class="cell temp"><span id="outbuildingTemp">—</span></div>
          <div class="cell hum"></div>`);
    }

    async function load_nest() {
      const grid = document.getElementById('nestGrid');
      if (!grid) return;
      try {
        const data = await fetchJSON(REL).catch(() => fetchJSON(ABS));
        renderNestGrid(grid, data.thermostats);
      } catch {
        setTimeout(async () => {
          try {
            const data = await fetchJSON(ABS);
            renderNestGrid(grid, data.thermostats);
          } catch {
            const existingOut = `
              <div class="cell room">Outbuilding</div>
              <div class="cell temp"><span id="outbuildingTemp">—</span></div>
              <div class="cell hum"></div>`;
            grid.innerHTML = `
              <div class="cell room">Unavailable</div>
              <div class="cell temp">—</div>
              <div class="cell hum">—</div>
            ` + existingOut;
          }
        }, 1500);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      load_nest();
      setInterval(load_nest, REFRESH_MS);
    });
  </script>

  <!-- === Outbuilding Updater === -->
  <script>
    (async () => {
      const REL = "data/outbuilding.txt";
      const ABS = "file:///home/fcapria/app/data/outbuilding.txt";
      const REFRESH_MS = 1800000; // 30 minutes

      async function loadOutbuilding() {
        try {
          const res = await fetch(REL).catch(() => fetch(ABS));
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const text = (await res.text()).trim();
          const span = document.getElementById("outbuildingTemp");
          if (span) span.textContent = text || "—";
        } catch {
          const span = document.getElementById("outbuildingTemp");
          if (span) span.textContent = "Unavailable";
        }
      }
      loadOutbuilding();
      setInterval(loadOutbuilding, REFRESH_MS);
    })();
  </script>

<!-- === Solar Event Script (corrected SunCalc math) === -->
<script>
(() => {
  const LAT = 44.279397, LON = -69.007578, TZ = "America/New_York";
  const DEG2RAD = Math.PI / 180, J2000 = 2451545, J0 = 0.0009;
  const e = DEG2RAD * 23.4397;                         // axial tilt

  const toJulian   = d => d.getTime()/86400000 + 2440587.5;
  const fromJulian = j => new Date((j - 2440587.5)*86400000);
  const daysSinceJ2000 = d => toJulian(d) - J2000;

  const sin = Math.sin, cos = Math.cos, asin = Math.asin, acos = Math.acos;
  const solarMeanAnomaly   = d => DEG2RAD * (357.5291 + 0.98560028*d);
  const eclipticLongitude  = M => {
    const C = DEG2RAD*(1.9148*sin(M) + 0.0200*sin(2*M) + 0.0003*sin(3*M));
    const P = DEG2RAD*102.9372;
    return M + C + P + Math.PI;
  };
  const solarDeclination   = L => asin(sin(L) * sin(e));
  const hourAngle = (h0, phi, dec) =>
    acos((sin(h0) - sin(phi)*sin(dec)) / (cos(phi)*cos(dec)));

  // Returns absolute Date instants for sunrise/sunset at given local calendar date
  function getSunTimes(dateLocal, lat, lon) {
    // Anchor at UTC noon for the calendar date to avoid DST edges
    const dateUTCNoon = new Date(Date.UTC(dateLocal.getFullYear(), dateLocal.getMonth(), dateLocal.getDate(), 12, 0, 0));
    const d  = daysSinceJ2000(dateUTCNoon);
    const lw = -lon * DEG2RAD;     // NOTE: negative longitude
    const phi =  lat * DEG2RAD;

    // Correct day index and solar day offset (SunCalc/NOAA)
    const n  = Math.round(d - J0 - lw/(2*Math.PI));
    const ds = n - lw/(2*Math.PI);

    const M = solarMeanAnomaly(ds);
    const L = eclipticLongitude(M);
    const dec = solarDeclination(L);

    // Solar transit (local solar noon)
    const Jtransit = J2000 + J0 + ds + 0.0053*sin(M) - 0.0069*sin(2*L);

    // Civil rise/set altitude
    const h0 = DEG2RAD * -0.833;
    const w0 = hourAngle(h0, phi, dec);

    // Rise/Set (include J0 term and longitude properly) 
    const Jrise = J2000 + J0 + ( -w0 + lw )/(2*Math.PI) + n + 0.0053*sin(M) - 0.0069*sin(2*L);
    const Jset  = J2000 + J0 + (  w0 + lw )/(2*Math.PI) + n + 0.0053*sin(M) - 0.0069*sin(2*L);

    return { sunrise: fromJulian(Jrise), sunset: fromJulian(Jset), solarNoon: fromJulian(Jtransit) };
  }

  const fmtTime = d => d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: TZ });
  const fmtShort = ms => {
    const neg = ms < 0; let s = Math.abs(Math.floor(ms/1000));
    const h = Math.floor(s/3600); s -= h*3600;
    const m = Math.floor(s/60);   s -= m*60;
    return (neg ? "−" : "") + (h ? `${h}h ${m}m` : `${m}m ${s}s`);
  };

  function nextSolarEvent(now = new Date()) {
    // Determine today's calendar date in America/New_York
    const tzNow = new Date(now.toLocaleString("en-US", { timeZone: TZ }));
    const today = new Date(tzNow.getFullYear(), tzNow.getMonth(), tzNow.getDate());
    const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);

    const todayTimes = getSunTimes(today, LAT, LON);
    const nextTimes  = getSunTimes(tomorrow, LAT, LON);

    const nowAbs = now; // compare absolute instants
    if (nowAbs < todayTimes.sunrise) return { label: "Sunrise", at: todayTimes.sunrise };
    if (nowAbs < todayTimes.sunset)  return { label: "Sunset",  at: todayTimes.sunset  };
    return { label: "Sunrise", at: nextTimes.sunrise };
  }

  const timeEl  = document.getElementById("solar-time");
  const countEl = document.getElementById("solar-count");

  function render() {
    const evt = nextSolarEvent();
    const ms = evt.at.getTime() - Date.now();
    timeEl.textContent  = `${evt.label}  ${fmtTime(evt.at)}`;
    countEl.textContent = ms >= 0 ? `in ${fmtShort(ms)}` : `since ${fmtShort(ms)}`;
  }

  render();
  setInterval(render, 1000);
})();
</script>
<script>
(() => {
  const REL = "data/tides.json";
  const ABS = "file:///home/fcapria/app/data/tides.json";
  const REFRESH_MS = 180000; // 3 minutes

  const elHigh = document.getElementById("tide-high-label");
  const elLow = document.getElementById("tide-low-label");
  const elArrow = document.getElementById("tide-arrow");
  const elMarker = document.getElementById("tide-marker");
  const elCurrent = document.getElementById("tide-current-label");
  const bar = document.querySelector(".tide-bar");

  async function fetchJSON(url) {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }

  // Parse "10' 9\"" or "5.3" into feet as a number
  function parseHeight(h) {
    if (h == null) return null;
    if (typeof h === "number") return h;
    const s = String(h).trim();
    // match feet'inches"
    let m = s.match(/(\d+)\s*'\s*(\d+)?/);
    if (m) {
      const ft = parseInt(m[1], 10);
      const inch = m[2] ? parseInt(m[2], 10) : 0;
      return ft + inch / 12;
    }
    const n = parseFloat(s);
    return isNaN(n) ? null : n;
  }

  function render(d) {
    const prevH = parseHeight(d.previousHeight);
    const nextH = parseHeight(d.nextHeight);
    const curH  = parseHeight(d.currentHeight);

    // ---- High / Low labels (this was wrong before) ----
    let highText = "—";
    if (d.previousEvent && d.previousEvent.startsWith("High")) {
      highText = d.previousHeight || highText;
    }
    if (d.nextEvent && d.nextEvent.startsWith("High")) {
      highText = d.nextHeight || highText;
    }

    let lowText = "—";
    if (d.previousEvent && d.previousEvent.startsWith("Low")) {
      lowText = d.previousHeight || lowText;
    }
    if (d.nextEvent && d.nextEvent.startsWith("Low")) {
      lowText = d.nextHeight || lowText;
    }

    elHigh.textContent = `High ${highText}`;
    elLow.textContent  = `Low ${lowText}`;
    elCurrent.textContent = `Current ${d.currentHeight || "—"}`;

    // ---- Scale + marker position ----
    const vals = [prevH, nextH, curH].filter(v => v != null);
    let min = Math.min(...vals);
    let max = Math.max(...vals);

    if (!isFinite(min) || !isFinite(max) || min === max) {
      min = 0;
      max = 10;
    }

    let frac = 0.5;
    if (curH != null) {
      const clamped = Math.max(min, Math.min(max, curH));
      // 0 = top (high), 1 = bottom (low)
      frac = (max - clamped) / (max - min);
    }

    const barHeight = (bar && bar.clientHeight) || 360;
    elMarker.style.top = `${frac * barHeight}px`;

    // Vertically align "Current" label with the marker (Y-axis only)
    if (bar && elCurrent) {
      const barRect = bar.getBoundingClientRect();
      const currentRect = elCurrent.getBoundingClientRect();

      const markerY = barRect.top + frac * barHeight;
      const currentCenterY = currentRect.top + currentRect.height / 2;
      const deltaY = markerY - currentCenterY;

      elCurrent.style.transform = `translateY(${deltaY}px)`;
    }


    // ---- Arrow: what we are moving toward ----
    if (d.nextEvent && d.nextEvent.startsWith("High")) {
      elArrow.textContent = "↑";
    } else if (d.nextEvent && d.nextEvent.startsWith("Low")) {
      elArrow.textContent = "↓";
    } else {
      elArrow.textContent = "·";
    }
  }

  async function loadTides() {
    try {
      const data = await fetchJSON(REL).catch(() => fetchJSON(ABS));
      render(data);
    } catch {
      elHigh.textContent = "High —";
      elLow.textContent = "Low —";
      elArrow.textContent = "·";
      elCurrent.textContent = "Current unavailable";
    }
  }

  loadTides();
  setInterval(loadTides, REFRESH_MS);
})();
</script>

</body>
</html>
